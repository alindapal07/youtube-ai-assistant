[project]
name = "youtubetranscriptplugin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alindapal07", email = "151637518+alindapal07@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
youtubetranscriptplugin = "youtubetranscriptplugin:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
